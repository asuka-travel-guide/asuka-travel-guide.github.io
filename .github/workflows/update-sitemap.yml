name: サイトマップ自動更新

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'spots/*.html'

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 変更されたファイルの一覧を作る
        run: |
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          cat "$RUNNER_TEMP/changed.txt"

      - name: サイトマップとllms.txtを更新
        run: python3 tools/update_sitemap.py --changed "$RUNNER_TEMP/changed.txt"

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- asuka-sitemap.xml llms.txt; then
            echo "変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add asuka-sitemap.xml llms.txt
            git commit -m "サイトマップ自動更新 [skip ci]"
            git push
          fi
